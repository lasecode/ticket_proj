{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | EventHub</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Event<span>Hub</span><span class="dot">.</span></a>
    <div class="nav-actions">
      <a href="/register/" class="btn btn-primary">Sign Up</a>
    </div>
  </div>
</nav>

<main class="auth-page">
  <div class="container">
    <div class="auth-card">
      <div style="text-align:center;font-size:2.5rem;margin-bottom:1rem">🎫</div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to access your tickets and bookings</p>

      <div id="loginAlert" class="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-control" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn" style="margin-top:.5rem">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register/">Sign up free</a>
      </div>

      <!-- Demo credentials hint -->
      <div style="margin-top:1.5rem;padding:1rem;background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.2);border-radius:10px;font-size:.8rem">
        <div style="font-weight:700;color:var(--primary-light);margin-bottom:.5rem">🔑 Demo Credentials</div>
        <div style="color:var(--text-secondary)">
          <div><strong>Admin:</strong> admin@example.com / Admin123!</div>
          <div><strong>User:</strong> user@example.com / User123!</div>
        </div>
        <div style="display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="fillDemo('admin@example.com','Admin123!')">Fill Admin</button>
          <button class="btn btn-outline btn-sm" onclick="fillDemo('user@example.com','User123!')">Fill User</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/login.js' %}"></script>
<script>
function fillDemo(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}
</script>
</body>
</html>
